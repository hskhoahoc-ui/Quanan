<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Quán ăn Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .room-empty { background-color: #d1e7dd !important; border-color: #badbcc !important; cursor: pointer; transition: 0.2s; }
        .room-empty:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .room-busy { background-color: #f8d7da !important; border-color: #f5c2c7 !important; cursor: pointer; transition: 0.2s; }
        .room-busy:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .food-item-title { color: #0d6efd; font-weight: bold; }
        .food-item-price { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 py-2 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="#"><span id="brand-name">Quán ăn Demo</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                <ul class="navbar-nav mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="#" onclick="switchTab('food-catalog', this)">Danh mục món ăn</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('rooms', this)">Danh sách Bàn</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('menu-price', this)">Bảng Giá Thực Đơn</a></li>
                    <li class="nav-item"><a class="nav-link position-relative" href="#" onclick="switchTab('online-order', this)">🛒 Đặt Hàng Online</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3 small d-none d-md-inline" id="user-info-display"></span>
                    <a href="admin.html" class="btn btn-outline-light btn-sm me-2" id="admin-nav" style="display:none;">Quản Trị / Thêm Món</a>
                    <button class="btn btn-outline-warning btn-sm me-2" id="login-btn" onclick="openLoginModal()">Đăng Nhập</button>
                    <button class="btn btn-outline-danger btn-sm" id="logout-btn" style="display:none;" onclick="logout()">Đăng Xuất</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- TAB 1: DANH MỤC MÓN ĂN (MẶC ĐỊNH CHẠY TRƯỚC KHI VÀO TRANG CHÍNH) -->
    <div class="container my-4 tab-section" id="tab-food-catalog">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold fs-4">Danh Mục Món Ăn Hôm Nay</h3>
        </div>
        <div class="row" id="food-catalog-container"></div>
    </div>

    <!-- TAB 2: DANH SÁCH BÀN -->
    <div class="container my-4 tab-section" id="tab-rooms" style="display:none;">
        <div class="d-flex justify-content-between align-items-md-center mb-4 gap-2">
            <h3 id="facility-title" class="fw-bold fs-4">Sơ Đồ Bàn</h3>
        </div>
        <div class="row" id="room-container"></div>
    </div>

    <!-- TAB 3: BẢNG GIÁ THỰC ĐƠN & DỊCH VỤ ĐỒ ĂN -->
    <div class="container my-4 tab-section" id="tab-menu-price" style="display:none;">
        <h3 class="fw-bold fs-4 mb-3">Mục Bảng Giá Thực Đơn & Dịch Vụ Đồ Ăn</h3>
        <div class="row" id="menu-price-container"></div>
    </div>

    <!-- TAB 4: ĐẶT HÀNG ONLINE -->
    <div class="container my-4 tab-section" id="tab-online-order" style="display:none;">
        <h3 class="fw-bold fs-4 mb-3">Đặt Hàng Online</h3>
        <p class="text-muted">Tính năng đặt hàng online đang hoạt động.</p>
    </div>

    <!-- MODAL ĐĂNG NHẬP -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4">
                <h4 class="mb-3 fw-bold">Đăng Nhập Hệ Thống</h4>
                <div class="mb-3">
                    <label class="form-label">Tài khoản:</label>
                    <input type="text" id="login-username" class="form-control" placeholder="admin hoặc nhanvien">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu:</label>
                    <input type="password" id="login-password" class="form-control" placeholder="Mật khẩu...">
                </div>
                <button class="btn btn-primary w-100 fw-bold" onclick="submitLogin()">Đăng Nhập</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-section').forEach(el => el.style.display = 'none');
            document.getElementById('tab-' + tabId).style.display = 'block';
            document.querySelectorAll('.navbar-nav .nav-link').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        function openLoginModal() {
            new bootstrap.Modal(document.getElementById('loginModal')).show();
        }

        async function submitLogin() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if(data.success) {
                localStorage.setItem('user', JSON.stringify(data.user));
                alert('Đăng nhập thành công!');
                window.location.href = 'admin.html';
            } else {
                alert(data.error || 'Sai tài khoản hoặc mật khẩu!');
            }
        }

        async function init() {
            const resSet = await fetch('/api/settings');
            const settings = await resSet.json();
            const brandName = settings.name || 'Quán ăn Demo';
            document.getElementById('brand-name').innerText = brandName;
            document.getElementById('page-title').innerText = brandName;

            const user = JSON.parse(localStorage.getItem('user'));
            if(user && (user.role === 'admin' || user.role === 'staff')) {
                document.getElementById('admin-nav').style.display = 'inline-block';
                document.getElementById('user-info-display').innerText = `Xin chào: ${user.username} (${user.role === 'admin' ? 'Admin' : 'Nhân viên'})`;
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'inline-block';
            }

            loadFoodCatalog();
            loadMenuPrice();
        }

        async function loadFoodCatalog() {
            const res = await fetch('/api/menu');
            const menu = await res.json();
            
            // Bố trí mỗi dòng 3 món ăn
            const container = document.getElementById('food-catalog-container');
            container.innerHTML = menu.map(item => `
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow-sm border">
                        <img src="${item.image_url || 'https://via.placeholder.com/300x200?text=Quán+ăn+Demo'}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="${item.item_name}">
                        <div class="card-body d-flex flex-column justify-content-between">
                            <div>
                                <h5 class="food-item-title">${item.item_name}</h5>
                                <p class="text-muted small mb-2">${item.description || 'Món ăn ngon hấp dẫn tại quán.'}</p>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <span class="food-item-price fs-5">${Number(item.price).toLocaleString()}đ</span>
                                <span class="badge bg-secondary">${item.unit || 'phần'}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function loadMenuPrice() {
            const res = await fetch('/api/menu');
            const menu = await res.json();
            const container = document.getElementById('menu-price-container');
            container.innerHTML = menu.map(item => `
                <div class="col-md-4 mb-3">
                    <div class="card p-3 shadow-sm">
                        <h5 class="food-item-title">${item.item_name}</h5>
                        <p class="mb-1 text-muted small">Danh mục: ${item.category}</p>
                        <p class="food-item-price mb-0">${Number(item.price).toLocaleString()}đ / ${item.unit || 'phần'}</p>
                    </div>
                </div>
            `).join('');
        }

        function logout() {
            localStorage.removeItem('user');
            location.reload();
        }

        init();
    </script>
</body>
</html>
