<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Quán ăn Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .room-empty { background-color: #d1e7dd !important; cursor: pointer; transition: 0.2s; }
        .room-busy { background-color: #f8d7da !important; cursor: pointer; transition: 0.2s; }
        .food-item-title { color: #0d6efd; font-weight: bold; }
        .food-item-price { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 py-2 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><span id="brand-name">Quán ăn Demo</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                <ul class="navbar-nav mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="#" onclick="switchTab('food-catalog', this)">Danh Mục Món Ăn</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('rooms', this)">Danh Sách Bàn</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('menu-price', this)">Bảng Giá Thực Đơn & Dịch Vụ</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('online-order', this)">🛒 Đặt Hàng Online</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3 small" id="user-info-display"></span>
                    <a href="admin.html" class="btn btn-outline-light btn-sm me-2" id="admin-nav" style="display:none;">Khu Vực Quản Trị</a>
                    <button class="btn btn-outline-warning btn-sm me-2" id="login-btn" onclick="openLoginModal()">Đăng Nhập</button>
                    <button class="btn btn-outline-danger btn-sm" id="logout-btn" style="display:none;" onclick="logout()">Đăng Xuất</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- BANNER QUẢNG CÁO -->
    <div id="banner-container" class="container my-3"></div>

    <!-- TAB 1: DANH MỤC MÓN ĂN (HIỂN THỊ ĐẦU TIÊN - 3 MÓN / DÒNG) -->
    <div class="container my-4 tab-section" id="tab-food-catalog">
        <h3 class="fw-bold fs-4 mb-3">Danh Mục Món Ăn Hôm Nay</h3>
        <div class="row" id="food-catalog-container"></div>
    </div>

    <!-- TAB 2: DANH SÁCH BÀN -->
    <div class="container my-4 tab-section" id="tab-rooms" style="display:none;">
        <h3 class="fw-bold fs-4 mb-3">Sơ Đồ Bàn Trực Tuyến</h3>
        <div class="row" id="room-container"></div>
    </div>

    <!-- TAB 3: BẢNG GIÁ THỰC ĐƠN TÁCH ĐỒ ĂN / ĐỒ UỐNG -->
    <div class="container my-4 tab-section" id="tab-menu-price" style="display:none;">
        <h3 class="fw-bold fs-4 mb-3">Bảng Giá Thực Đơn & Dịch Vụ</h3>
        <div class="row">
            <div class="col-md-6">
                <h4 class="text-success fs-5 fw-bold">🍲 Món Đồ Ăn</h4>
                <div id="menu-food-list" class="list-group mb-4"></div>
            </div>
            <div class="col-md-6">
                <h4 class="text-primary fs-5 fw-bold">🥤 Món Đồ Uống</h4>
                <div id="menu-drink-list" class="list-group"></div>
            </div>
        </div>
    </div>

    <!-- TAB 4: ĐẶT HÀNG ONLINE -->
    <div class="container my-4 tab-section" id="tab-online-order" style="display:none;">
        <div class="card p-4 shadow-sm" style="max-width: 600px; margin: auto;">
            <h3 class="fw-bold fs-4 mb-3">Đặt Hàng Online</h3>
            <div class="mb-3"><label>Họ tên khách hàng:</label><input type="text" id="o-name" class="form-control"></div>
            <div class="mb-3"><label>Số điện thoại:</label><input type="text" id="o-phone" class="form-control"></div>
            <div class="mb-3"><label>Địa chỉ giao hàng:</label><textarea id="o-address" class="form-control" rows="2"></textarea></div>
            <h5 class="mt-3">Chọn món:</h5>
            <div id="online-menu-checkboxes" class="mb-3"></div>
            <button class="btn btn-success w-100 fw-bold" onclick="submitOnlineOrder()">Gửi Đơn Hàng Online</button>
        </div>
    </div>

    <!-- MODAL ĐĂNG NHẬP -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4">
                <h4 class="mb-3 fw-bold">Đăng Nhập Quản Trị / Nhân Viên</h4>
                <div class="mb-3"><label>Tài khoản:</label><input type="text" id="login-username" class="form-control" placeholder="admin hoặc nhanvien"></div>
                <div class="mb-3"><label>Mật khẩu:</label><input type="password" id="login-password" class="form-control" placeholder="Mật khẩu..."></div>
                <button class="btn btn-primary w-100 fw-bold" onclick="submitLogin()">Đăng Nhập</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-section').forEach(el => el.style.display = 'none');
            document.getElementById('tab-' + tabId).style.display = 'block';
            document.querySelectorAll('.navbar-nav .nav-link').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        function openLoginModal() { new bootstrap.Modal(document.getElementById('loginModal')).show(); }

        async function submitLogin() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
            const data = await res.json();
            if(data.success) {
                localStorage.setItem('user', JSON.stringify(data.user));
                alert('Đăng nhập thành công!');
                window.location.href = 'admin.html';
            } else {
                alert(data.error);
            }
        }

        async function init() {
            const resSet = await fetch('/api/settings');
            const settings = await resSet.json();
            const brandName = settings.name || 'Quán ăn Demo';
            document.getElementById('brand-name').innerText = brandName;
            document.getElementById('page-title').innerText = brandName;

            if(settings.banners) {
                const banners = settings.banners.split('\n').filter(b => b.trim() !== '');
                if(banners.length > 0) {
                    document.getElementById('banner-container').innerHTML = `<img src="${banners[0]}" class="w-100 rounded shadow-sm" style="max-height: 250px; object-fit: cover;">`;
                }
            }

            const user = JSON.parse(localStorage.getItem('user'));
            if(user && (user.role === 'admin' || user.role === 'staff')) {
                document.getElementById('admin-nav').style.display = 'inline-block';
                document.getElementById('user-info-display').innerText = `${user.username} (${user.role})`;
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'inline-block';
            }

            loadFoodCatalog();
            loadMenuPriceTab();
            loadRooms();
            loadOnlineMenu();
        }

        async function loadFoodCatalog() {
            const res = await fetch('/api/menu');
            const menu = await res.json();
            // Bố trí 3 món mỗi dòng (col-md-4)
            document.getElementById('food-catalog-container').innerHTML = menu.map(item => `
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow-sm border">
                        <img src="${item.image_url || 'https://via.placeholder.com/300x200?text=Quán+ăn+Demo'}" class="card-img-top" style="height: 180px; object-fit: cover;" alt="${item.item_name}">
                        <div class="card-body d-flex flex-column justify-content-between">
                            <div>
                                <h5 class="food-item-title">${item.item_name}</h5>
                                <p class="text-muted small mb-2">${item.description || ''}</p>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <span class="food-item-price fs-5">${Number(item.price).toLocaleString()}đ</span>
                                <span class="badge bg-secondary">${item.unit || 'phần'}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function loadMenuPriceTab() {
            const res = await fetch('/api/menu');
            const menu = await res.json();
            const foods = menu.filter(m => m.category === 'Đồ ăn');
            const drinks = menu.filter(m => m.category === 'Đồ uống');

            document.getElementById('menu-food-list').innerHTML = foods.map(f => `
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <div><b class="food-item-title">${f.item_name}</b><br><small class="text-muted">${f.description || ''}</small></div>
                    <span class="food-item-price">${Number(f.price).toLocaleString()}đ / ${f.unit || 'phần'}</span>
                </div>
            `).join('');

            document.getElementById('menu-drink-list').innerHTML = drinks.map(d => `
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <div><b class="food-item-title">${d.item_name}</b><br><small class="text-muted">${d.description || ''}</small></div>
                    <span class="food-item-price">${Number(d.price).toLocaleString()}đ / ${d.unit || 'ly'}</span>
                </div>
            `).join('');
        }

        async function loadRooms() {
            const res = await fetch('/api/rooms');
            const rooms = await res.json();
            document.getElementById('room-container').innerHTML = rooms.map(room => `
                <div class="col-md-3 mb-3">
                    <div class="card ${room.status !== 'Trống' ? 'room-busy' : 'room-empty'} p-3 shadow-sm border">
                        <h5 class="fw-bold">${room.room_name}</h5>
                        <p class="mb-0">Trạng thái: <b>${room.status}</b></p>
                    </div>
                </div>
            `).join('');
        }

        async function loadOnlineMenu() {
            const res = await fetch('/api/menu');
            const menu = await res.json();
            document.getElementById('online-menu-checkboxes').innerHTML = menu.map(m => `
                <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2">
                    <div><b>${m.item_name}</b> - <span class="text-danger">${Number(m.price).toLocaleString()}đ</span></div>
                    <input type="number" id="online-qty-${m.id}" value="0" min="0" class="form-control form-control-sm" style="width: 80px;">
                </div>
            `).join('');
        }

        async function submitOnlineOrder() {
            const customer_name = document.getElementById('o-name').value;
            const customer_phone = document.getElementById('o-phone').value;
            const delivery_address = document.getElementById('o-address').value;
            if(!customer_name || !customer_phone || !delivery_address) return alert('Vui lòng điền đầy đủ thông tin giao hàng!');

            const resMenu = await fetch('/api/menu');
            const menu = await resMenu.json();
            let items = [];
            menu.forEach(m => {
                const qty = parseInt(document.getElementById(`online-qty-${m.id}`).value) || 0;
                if(qty > 0) items.push({ item_id: m.id, item_name: m.item_name, price: m.price, quantity: qty, unit: m.unit });
            });

            if(items.length === 0) return alert('Vui lòng chọn ít nhất 1 món!');

            const res = await fetch('/api/online-orders/submit', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ customer_name, customer_phone, delivery_address, items })
            });
            const data = await res.json();
            if(data.success) {
                alert('Đặt hàng online thành công!');
                location.reload();
            }
        }

        function logout() { localStorage.removeItem('user'); location.reload(); }

        init();
    </script>
</body>
</html>
